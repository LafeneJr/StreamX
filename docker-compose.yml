

services:
  frontend:
    build: ./streaming-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./streaming-frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000/api
    depends_on:
      - backend

  backend:
    build: ./Subscriptions
    ports:
      - "5000:5000"
    volumes:
      - ./Subscriptions:/app
      - /app/node_modules
    env_file:
      - ./Subscriptions/.env
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin123
      POSTGRES_DB: Subscriptions
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: